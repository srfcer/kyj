<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Logger Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Bienvenido a mi sitio</h1>
<p>Este sitio fue creado con propositos educativos.</p>

<script type="module">
import { logAccess } from './firebase.js';

async function getIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
    } catch {
        return "Desconocida";
    }
}


async function getDatosIP(ip) {
    try {
        const res = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await res.json();

        return {
            isp: data.org || "Desconocido",
            pais: data.country_name,
            ciudad: data.city
        };
    } catch {
        return { isp: "Error" };
    }
}


(async () => {
    const ip = await getIP();
    const datos = await getDatosIP(ip);

    const logData = {
        ip: ip,
        isp: datos.isp,
        pais: datos.pais,
        ciudad: datos.ciudad,
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        idioma: navigator.language,
        fecha: new Date().toISOString()
    };

    logAccess(logData);
})();
</script>

</body>
</html>
